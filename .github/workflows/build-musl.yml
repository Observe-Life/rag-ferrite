name: Build musl binary and image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "构建后推送镜像到 GHCR"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+crt-static"
  # bundled rusqlite 与 sqlite-vec 要编译 C 代码，musl 目标必须显式指定交叉编译器
  CC_x86_64_unknown_linux_musl: "musl-gcc"
  AR_x86_64_unknown_linux_musl: "ar"
  # sqlite-vec.c 依赖 glibc <sys/types.h> 里的历史 typedef `u8`（unsigned char），
  # musl 不提供该定义，编译器会退化成 int，导致指针宽度不匹配。
  # 这里用 -include 注入一个 shim 头补上定义，而不是用 -Wno-incompatible-pointer-types
  # 压掉警告——压掉警告会让 bitmap 按错误位宽索引内存，变成运行时数据损坏。
  CFLAGS_x86_64_unknown_linux_musl: "-include /tmp/musl-u8-shim.h"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools file

      # edition = "2024" 要求 Rust >= 1.85
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: musl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: musl-${{ runner.os }}-

      - name: Generate musl compat shim
        # sqlite-vec.c 使用 BSD 风格类型别名 u_int8_t/u_int16_t/u_int32_t/u_int64_t，
        # musl 的 <sys/types.h> 只在 _BSD_SOURCE 或 _GNU_SOURCE 下暴露这些别名，
        # 而 glibc 无条件暴露（上游 CI 只在 ubuntu/glibc 跑，所以从未触发）。
        #
        # 这里只打开 _BSD_SOURCE 并提前引入 <sys/types.h>，让 musl 用它自己的定义，
        # 类型宽度必然与调用处一致。不要自己 typedef 补 u8：sqlite-vec.c:77 已经
        # 自行 `typedef uint8_t u8;`，重复定义会直接冲突（上一版就是这么失败的）。
        #
        # __ASSEMBLER__ 保护是必需的：CFLAGS_<target> 按 target 全局生效，
        # ring crate 会用它编译 .S 汇编，C 代码会被当成汇编指令解析而报错。
        run: |
          {
            echo '#ifndef RAGFER_MUSL_BSD_TYPES_SHIM_H'
            echo '#define RAGFER_MUSL_BSD_TYPES_SHIM_H'
            echo '#ifndef __ASSEMBLER__'
            echo '#ifndef _BSD_SOURCE'
            echo '#define _BSD_SOURCE'
            echo '#endif'
            echo '#include <sys/types.h>'
            echo '#endif'
            echo '#endif'
          } > /tmp/musl-u8-shim.h
          cat /tmp/musl-u8-shim.h

      - name: Build static binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/ragfer ./ragfer

      - name: Verify it is really static
        run: |
          file ./ragfer
          ls -lh ./ragfer
          if file ./ragfer | grep -q "dynamically linked"; then
            echo "::error::二进制仍是动态链接，scratch 镜像会起不来"
            exit 1
          fi
          # 权威确认：静态二进制不应有任何动态依赖。
          # 不用 `ragfer --version` 做冒烟测试——该 CLI 不支持这个参数，
          # 它会打印帮助并以 exit 1 结束（第四次构建就是这么失败的）。
          # scratch 镜像内没有 shell，运行验证只能在部署后通过 HTTP 健康检查做。
          ldd ./ragfer 2>&1 | tee /tmp/ldd.txt
          if ! grep -qE "not a dynamic executable|statically linked" /tmp/ldd.txt; then
            echo "::error::ldd 显示存在动态依赖，scratch 镜像会缺库"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ragfer-linux-musl
          path: ./ragfer
          retention-days: 14

  image:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ragfer-linux-musl
          path: ./

      - name: Prepare binary
        run: chmod +x ./ragfer && ls -lh ./ragfer

      - name: Compute image tag
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          lower=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          # 标签必须带 ghcr.io/ 前缀。漏掉前缀会让 buildx 以为要推到 Docker Hub，
          # 拿 GitHub 令牌去 auth.docker.io 认证，报 401 insufficient scopes
          # ——这正是前五次构建末尾那个"看起来像权限限制"的假象来源。
          img="ghcr.io/${lower}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            echo "tags=${img}:latest,${img}:${v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${img}:canary" >> "$GITHUB_OUTPUT"
          fi

      - name: Show what will be pushed
        run: |
          echo "将推送: ${{ steps.meta.outputs.tags }}"
          case "${{ steps.meta.outputs.tags }}" in
            ghcr.io/*) ;;
            *) echo "::error::标签缺少 ghcr.io/ 前缀，会误推到 Docker Hub"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push_image || github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
