name: Rust quality gates

on:
  # 手动触发：fmt.yml 由 Actions 自己提交，不触发工作流；而带 paths-ignore 的
  # push 过滤器会把「空提交」整条过滤掉（2026-11-05 实测：补空提交并不重跑关卡）。
  # 所以格式化之后必须能手动跑一次质量关卡，否则 rustfmt 之后的代码无人验证。
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # 只改文档时不跑质量关卡：这套关卡要编译整个 workspace 并跑 cargo audit，
  # 纯文档提交触发它只会产出一条与改动无关的红项（audit 恒红），
  # 看起来像「文档提交导致构建失败」。
  # 故意不忽略 .github/workflows/**：改 CI 配置本身必须被验证。

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
